name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Keine Abhängigkeiten — npm ci gäbe es nichts zu installieren.
      - name: Seite prüfen
        run: npm run lint

      - name: Tests
        run: npm test
